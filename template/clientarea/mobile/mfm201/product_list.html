<div class="template">
  <div class="cloudreve-product-list" style="padding:16px;">
    <table style="width:100%;border-collapse:collapse;background:#fff;">      <thead>
        <tr>
          <th style="padding:10px 12px;border:1px solid #e5e7eb;background:#f5f7fa;text-align:left;">产品ID</th>
          <th style="padding:10px 12px;border:1px solid #e5e7eb;background:#f5f7fa;text-align:left;">商品名称</th>
          <th style="padding:10px 12px;border:1px solid #e5e7eb;background:#f5f7fa;text-align:left;">到期时间</th>
          <th style="padding:10px 12px;border:1px solid #e5e7eb;background:#f5f7fa;text-align:left;">状态</th>
        </tr>
      </thead>
      <tbody>
        {volist name="hosts" id="v"}
        <tr>
          <td style="padding:10px 12px;border:1px solid #e5e7eb;">{$v.id}</td>
          <td style="padding:10px 12px;border:1px solid #e5e7eb;">{$v.product_name|default='-'}</td>
          <td style="padding:10px 12px;border:1px solid #e5e7eb;">
            {if is_numeric($v.nextduedate) && $v.nextduedate > 0}{$v.nextduedate|date='Y-m-d H:i:s',###}{else}{$v.nextduedate|default='-'}{/if}
          </td>
          <td style="padding:10px 12px;border:1px solid #e5e7eb;">{$v.status}</td>
        </tr>
        {/volist}
        {empty name="hosts"}
        <tr><td colspan="4" style="padding:16px;color:#909399;text-align:center;">暂无产品</td></tr>
        {/empty}
      </tbody>
    </table>
  </div>
</div>
<script>
(function () {
  var m = document.getElementById("mainLoading");
  if (m) { m.style.display = "none"; }
  var t = document.getElementsByClassName("template")[0];
  if (t) { t.style.display = "block"; }
})();
</script>
